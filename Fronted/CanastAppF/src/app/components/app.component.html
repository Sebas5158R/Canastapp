<ion-app>

  <!-- El menú SOLO se renderiza si hay sesión activa -->
  <ion-menu
    *ngIf="sesionActiva"
    contentId="main-content"
    side="start"
    type="overlay"
    class="canastapp-menu"
  >

    <div class="menu-header">
      <div class="menu-brand-card">
        <div class="brand-mark">
          <ion-icon name="grid-outline"></ion-icon>
        </div>
        <div class="brand-copy">
          <p class="brand-name">Canastapp</p>
          <p class="brand-subtitle">Panel operativo</p>
        </div>
        <span class="session-chip" [class.session-chip--admin]="isAdmin">
          {{ isAdmin ? 'Admin' : 'Acceso' }}
        </span>
      </div>

      <div class="menu-user-card">
        <div class="avatar-wrapper">
          <img [src]="userAvatar" alt="Foto de usuario" class="user-avatar" />
          <span class="status-dot"></span>
        </div>

        <div class="user-info">
          <p class="user-name">{{ userName }}</p>
          <p class="user-role">{{ userRole }}</p>
        </div>

        <button class="settings-btn" (click)="goToSettings()" title="Configuración">
          <ion-icon name="settings-outline"></ion-icon>
        </button>
      </div>
    </div>

    <!-- Navegación -->
    <ion-content class="menu-content">
      <p class="nav-section-label">NAVEGACIÓN</p>
      <nav class="menu-nav">
        <ng-container *ngFor="let item of menuItems">
          <a
            *ngIf="!item.adminOnly || isAdmin"
            class="nav-item"
            [class.active]="isActive(item.url)"
            (click)="navigate(item.url)"
          >
            <span class="nav-icon-wrap">
              <ion-icon [name]="item.icon"></ion-icon>
            </span>
            <span class="nav-copy">
              <span class="nav-label">{{ item.title }}</span>
              <span class="nav-hint">{{ item.adminOnly ? 'Solo administradores' : 'Acceso general' }}</span>
            </span>
            <span class="nav-arrow">
              <ion-icon name="chevron-forward-outline"></ion-icon>
            </span>
          </a>
        </ng-container>
      </nav>

      <div class="menu-summary-card">
        <p class="summary-label">Sesión activa</p>
        <div class="summary-row">
          <span>
            <strong>{{ userName || 'Usuario' }}</strong>
            <small>{{ userRole || 'Sin rol' }}</small>
          </span>
          <button class="summary-action" (click)="goToSettings()" title="Abrir configuración">
            <ion-icon name="settings-outline"></ion-icon>
          </button>
        </div>
      </div>
    </ion-content>

    <!-- Footer -->
    <div class="menu-footer">
      <button class="logout-btn" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
        <span>Cerrar sesión</span>
      </button>
      <p class="app-version">Canastapp v1.0.0 · Producción</p>
    </div>

  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
