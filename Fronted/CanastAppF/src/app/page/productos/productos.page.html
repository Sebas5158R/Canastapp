<ion-header>

  <ion-toolbar>

    <ion-title>
      Productos
    </ion-title>

  </ion-toolbar>

</ion-header>

<ion-content class="ion-padding">

  <ion-list>

    <ion-item
      *ngFor="
        let producto of productos$ | async
      ">

      <ion-label>

        <h2>
          {{ producto.nombre }}
        </h2>

        <p>
          {{ producto.descripcion }}
        </p>

        <p>
          ${{ producto.precio }}
        </p>

      </ion-label>

    </ion-item>

  </ion-list>

</ion-content>
