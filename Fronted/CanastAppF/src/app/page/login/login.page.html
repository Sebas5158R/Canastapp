<ion-content class="ion-padding">

  <ion-card>

    <ion-card-content>

      <ion-item>
        <ion-label position="stacked">
          Correo
        </ion-label>

        <ion-input
          [(ngModel)]="email"
          type="email">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">
          Contraseña
        </ion-label>

        <ion-input
          [(ngModel)]="password"
          type="password">
        </ion-input>
      </ion-item>

      <ion-button
        expand="block"
        (click)="login()"
        [disabled]="loading">

        Ingresar

      </ion-button>

    </ion-card-content>

  </ion-card>

</ion-content>
