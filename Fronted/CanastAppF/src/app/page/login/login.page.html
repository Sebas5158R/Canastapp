<ion-content class="login-shell" [fullscreen]="true">
  <div class="login-card">
    <div class="brand-badge">
      <ion-icon name="log-in-outline"></ion-icon>
    </div>

    <p class="eyebrow">Canastapp</p>
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Accede con tu correo y contraseña para continuar.</p>

    <form (ngSubmit)="login()" class="login-form">
      <ion-item class="input-item" lines="none">
        <ion-icon slot="start" name="mail-outline"></ion-icon>
        <ion-label position="stacked">Correo</ion-label>
        <ion-input
          type="email"
          name="correo"
          [(ngModel)]="correo"
          placeholder="usuario@canastapp.com"
          autocomplete="email"
          required
        ></ion-input>
      </ion-item>

      <ion-item class="input-item" lines="none">
        <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
        <ion-label position="stacked">Contraseña</ion-label>
        <ion-input
          type="password"
          name="contrasena"
          [(ngModel)]="contrasena"
          placeholder="Tu contraseña"
          autocomplete="current-password"
          required
        ></ion-input>
      </ion-item>

      <ion-note *ngIf="error" color="danger" class="error-note">{{ error }}</ion-note>

      <ion-button expand="block" type="submit" class="login-btn" [disabled]="cargando">
        <ion-spinner *ngIf="cargando" name="crescent"></ion-spinner>
        <span *ngIf="!cargando">Entrar</span>
      </ion-button>
    </form>
  </div>
</ion-content>
